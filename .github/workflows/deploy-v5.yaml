name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout User Repository
        uses: actions/checkout@v4
        with:
          path: old-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Fresh Official Quartz
        run: git clone https://github.com/jackyzha0/quartz.git fresh-quartz

      - name: Assemble Perfect Clean Project
        run: |
          mkdir final-workspace
          cp -r fresh-quartz/* final-workspace/
          [ -d fresh-quartz/.github ] && cp -r fresh-quartz/.github final-workspace/ || true
          
          rm -rf final-workspace/content
          cp -r old-repo/content final-workspace/content
          
          [ -f old-repo/quartz.config.yaml ] && cp old-repo/quartz.config.yaml final-workspace/quartz.config.yaml || true
          [ -f old-repo/quartz.layout.yaml ] && cp old-repo/quartz.layout.yaml final-workspace/quartz.layout.yaml || true

      # 🚀【終極手術】不管快取如何作怪，在編譯前一秒，強制刪除 Head.tsx 裡面任何包含 CustomOgImages 的行！
      - name: Emergency Laser Surgery on Head.tsx
        run: |
          TARGET_HEAD="final-workspace/quartz/components/Head.tsx"
          if [ -f "$TARGET_HEAD" ]; then
            echo "Before surgery:"
            grep -n "CustomOgImages" "$TARGET_HEAD" || echo "No pollution found in fresh file"
            
            # 使用 sed 刪除包含關鍵字的整行程式碼
            sed -i '/CustomOgImages/d' "$TARGET_HEAD"
            
            echo "After surgery:"
            grep -n "CustomOgImages" "$TARGET_HEAD" || echo "Purification successful! Line eliminated."
          fi

      - name: Build Quartz Site
        run: |
          cd final-workspace
          npm ci
          npx quartz build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-workspace/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
