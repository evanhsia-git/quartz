name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout User Repository
        uses: actions/checkout@v4
        with:
          path: user-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Fresh Official Quartz v5
        run: git clone [https://github.com/jackyzha0/quartz.git](https://github.com/jackyzha0/quartz.git) pristine-quartz

      - name: Overwrite with User Index Page
        run: |
          rm -rf pristine-quartz/content
          mkdir -p pristine-quartz/content
          
          # 複製你的超級首頁進去
          cp user-repo/content/index.md pristine-quartz/content/index.md
          cp -r user-repo/content/* pristine-quartz/content/ 2>/dev/null || true
          
          # 🚀【雲端防誤判保險】在編譯前，強制抹除內容中所有可能引發 Esbuild 誤判的外掛關鍵字
          find pristine-quartz/content -type f -name "*.md" -exec sed -i '/CustomOgImages/d' {} +

      - name: Build Pure Quartz Site
        run: |
          cd pristine-quartz
          npm ci
          npx quartz build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pristine-quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
